<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="board-container">
        <h1>Scoreboard</h1>

        <label for="targetScore">First to:</label>
        <input type="number" id="targetScore" value="5">

        <div class="teams">
            <div class="team">
                <h2>Team A</h2>
                <p id="scoreA">0</p>
                <button id="addA">+1</button>
            </div>

            <div class="team">
                <h2>Team B</h2>
                <p id="scoreB">0</p>
                <button id="addB">+1</button>
            </div>
        </div>

        <p id="statusText"></p>

        <button id="resetBtn">Reset</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
